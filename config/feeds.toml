# Feeds that are not the Costco feed of a country in countries.toml.
#
# A feed is the capture unit: one chain in one country. Costco's fetch settings
# still live under [countries.*] because each of those countries has exactly one
# chain; anything else is declared here.
#
# Interpretation stays in countries.toml either way -- price_unit, bounds,
# timezones and the close/stale windows are properties of the market, not of the
# chain that sells into it.

[feeds.US-SAMS]
country = "US"
brand = "SAMS"

# ON. Read from Sam's Club's public store pages.
#
# Each club's current fuel prices are on the page a member would open,
# /club/<id>/fuel-center, embedded in the page's __NEXT_DATA__. The JSON
# club-finder's gasPrices array is stale -- 31-43% below the page for the six
# clubs checked on 2026-09-17 -- so the fuel-centre page is the price source.
# See src/club_gas/sources/sams.py and docs/samsclub-vivaldi-api.md.
#
# These are public, unauthenticated, robots-allowed pages read at low volume.
# Sam's Club's Terms of Use license site content for "personal, non-commercial
# use"; reviewed 2026-09-18, the owner accepted the risk of collecting and
# republishing, as with Costco. Off again is one line: enabled = false.
enabled = true

# The roster: the locator sitemap, one request, every club as /club/<id>-<city>.
# Deduplicated by id it is ~604 clubs; it does not say which sell fuel.
url = "https://www.samsclub.com/sitemap_locators.xml"

# Current prices, one club per request. `{club_id}` is filled per club. A fuel
# club answers 200 with the storeFuelPrices record in its __NEXT_DATA__; a
# non-fuel club 307s to /club/<id>, which the source leaves unfollowed and skips.
price_url = "https://www.samsclub.com/club/{club_id}/fuel-center"

# Clubs to ask about although the sitemap does not list them yet. Both of Sam's
# sitemaps (sitemap_locators.xml and sitemap_hyperlocals.xml) lag new clubs by
# weeks, while a new club's fuel station often opens before the club. Find the
# id from the club's own samsclub.com pages (/club/<id>/bakery and the like).
# An id the sitemap also lists is asked about once, so a row can stay after the
# sitemap catches up; remove it then to keep this list short.
extra_ids = [
  "4868", # Tomball TX: fuel station opened ~2026-11-05, club 2026-11-19
  "7718", # Visalia CA: fuel station opened ~2026-10-26, club not yet open
]

# This feed's own floor, in place of countries.US's, which counts Costco's
# stations. About 531 of ~604 clubs sell fuel; set below that so a short sweep
# is degraded rather than a silent partial. A sweep its budget cut short reads
# degraded on its own warning, whether or not it clears the floor.
floor = 460

# Seconds for the sweep, in place of http.toml's country budget of 480, which
# does not fit it. The sweep is 1 sitemap + ~604 club requests + extra_ids, all
# to www.samsclub.com, which http.toml paces at one per 1.0 s: about 607 s. A
# non-fuel club's 307 is near-instant but still takes a pacing slot, so the
# count, not the bytes, sets the pace. 715 s leaves ~108 s (18%) for slow pages
# and retries and stays under the 720 s capture budget every feed runs inside.
# Each extra id costs a second of that; tests/test_config.py fails once the
# list leaves less than 15%.
budget_s = 715.0
