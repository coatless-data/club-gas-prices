# Feeds that are not the Costco feed of a country in countries.toml.
#
# A feed is the capture unit: one chain in one country. Costco's fetch settings
# still live under [countries.*] because each of those countries has exactly one
# chain; anything else is declared here.
#
# Interpretation stays in countries.toml either way -- price_unit, bounds,
# timezones and the close/stale windows are properties of the market, not of the
# chain that sells into it.

[feeds.US-SAMS]
country = "US"
brand = "SAMS"

# OFF, because Sam's Club's bot protection refuses the collector's requests.
#
# On 2026-09-17 a dry capture on a GitHub-hosted runner sent a single request,
# the clubfinder roster below, with the project User-Agent. It answered HTTP 412
# with a PerimeterX challenge body --
# {"redirectUrl":"/are-you-human?...","appId":"PXsLC3j22K"} -- and the sweep
# stopped there. On 2026-09-18 the collector sent the same roster request from
# a home connection and was refused the same way: HTTP 412, PerimeterX. Two
# networks gave one answer, so it is the collector's requests that are refused,
# not GitHub's servers.
#
# The source, its tests and its fixtures stay. The feed stays off unless Sam's
# Club permits automated access; turning it back on is then one line, after a
# dry run of the collector's own requests.
enabled = false

# The roster: every US club in one request, with coordinates and the grades each
# sells. Its own `gasPrices` array is NOT read -- measured on 2026-09-17 it ran
# 31-43% below what a member pays -- so this is the roster only.
url = "https://www.samsclub.com/api/node/vivaldi/browse/v2/clubfinder/list"

# Current prices, one club per request: the persisted query's $nodeId is typed
# String!, so the schema itself refuses a batch.
price_url = "https://www.samsclub.com/orchestra/home/graphql/HyperLocalPagesTempo"

# The roster endpoint geocodes this and sorts by distance from it. The result set
# is the whole country either way; only the ordering and the `distance` field
# move, and neither is read.
origin_postcode = "75001"

# This feed's own floor, in place of countries.US's, which counts Costco's
# stations. 531 of 601 clubs had fuel on 2026-09-17; set below that so a short
# sweep is degraded rather than a silent partial. A sweep its budget cut short
# reads degraded on its own warning, whether or not it clears the floor.
floor = 460

# Seconds for the sweep, in place of http.toml's country budget of 480, which
# does not fit it. The sweep is 1 roster + 531 price requests = 532 requests,
# all to www.samsclub.com, which http.toml paces at one per 1.0 s: 532 s. Tempo
# answered in about 0.46 s during development, so the spacing sets the pace.
# 660 s leaves 128 s (24%) for slow answers, retries and new clubs, and stays
# under the 720 s capture budget that every feed runs inside.
budget_s = 660.0
