[site]
# The notice is built as this prefix plus one clause per brand in the data, so a
# third chain is a config line rather than an edit in four files. It is the only
# copy: publish, rollup and the dashboard all read it from here.
notice_prefix = "Unofficial. Prices are collected from public websites and may differ from the price at the pump."
release_base_url = "https://github.com/coatless-data/club-gas-prices/releases"
# The dashboard uses carto when this repository variable is set, otherwise osm.
basemap_key_env = "CARTO_BASEMAP_KEY"

[site.notices]
COSTCO = "Not affiliated with, endorsed by, or connected to Costco Wholesale Corporation."
SAMS = "Not affiliated with, endorsed by, or connected to Sam's West, Inc., Sam's Club, or Walmart Inc."

# sitedata copies the chosen provider table into meta.json verbatim, adding
# only "provider", so these key names are the ones the dashboard's Leaflet
# layer reads: light_url, dark_url, subdomains, max_zoom, dark_filter,
# attribution.

[site.basemaps.carto]
light_url = "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png?key={key}"
dark_url = "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png?key={key}"
subdomains = "abcd"
max_zoom = 20
# CARTO ships a real dark style, so the tiles are never filtered.
dark_filter = false
attribution = "© OpenStreetMap contributors © CARTO"

[site.basemaps.osm]
light_url = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
dark_url = "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
subdomains = ""
max_zoom = 19
# OSM has one style only, so dark mode inverts the tile pane in CSS.
dark_filter = true
attribution = "© <a href=\"https://www.openstreetmap.org/copyright\">OpenStreetMap contributors</a>"
