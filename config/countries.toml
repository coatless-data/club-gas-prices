# Per-country sources and interpretation tables.
#
# url, params and the other fetch keys (batch_size, seen_within_days,
# fallback_url, fallback_params, ecom_url, ecom_params, ecom_client_identifier)
# are FETCH config: what to request. They come from the capture bundle when
# history is rebuilt.
# price_unit, unit_overrides, bounds, floor, stale_after_days, closed_after_days
# and timezones are
# INTERPRETATION config: how to read a stored response. They always come from
# the live checkout, so fixing a bound or a timezone fixes history too.
#
# [countries.<CC>.params] holds QUERY PARAMETERS ONLY, flat, all strings: a
# fetcher urlencodes the whole table into the request. Everything else is a
# sibling key of the country table.
#
# Region keys are the region values the normalizer produces: US and CA use the
# two-letter state or province code, MX the ISO code without its "MX-" prefix,
# AU the state token. "*" is the default used when a station's region is null
# or unlisted; a country with no "*" drops stations whose timezone cannot be
# resolved rather than guessing one.

# --------------------------------------------------------------------- US ---
[countries.US]
url = "https://www.costco.com/AjaxGetGasPricesService"
price_unit = "USD/gal"
floor = 585
stale_after_days = 3
# A station absent from its country's feed for longer than this is called
# closed rather than missing. Long enough that a feed outage, a partial
# failure or a delisting over a refurbishment does not read as a closure.
closed_after_days = 45
# AjaxGetGasPricesService processes only the first 10 ids of a request.
batch_size = 10
seen_within_days = 30
ecom_url = "https://ecom-api.costco.com/core/warehouse-locator/v1/warehouses.json"
# A public id embedded in Costco's own front end; required by ecom-api.
ecom_client_identifier = "7c71124c-7bf1-44db-bc9d-498584cd66e5"
fallback_url = "https://www.costco.ca/AjaxWarehouseBrowseLookupView"

# The price service takes its ids as ?warehouseid=<id1>_<id2>_... built per
# batch, so it has no static query table.
[countries.US.params]

[countries.US.ecom_params]
latitude = "0"
longitude = "0"
limit = "5000"

[countries.US.fallback_params]
hasGas = "true"
populateWarehouseDetails = "true"
countryCode = "US"

[countries.US.unit_overrides]
# Puerto Rico retail fuel is sold per litre: #335 regular was 1.097 on
# 2026-09-15, about 4.15 per US gallon. Inferred, and disclosed on the About page.
PR = "USD/L"

[countries.US.bounds."USD/gal"]
min = 2.0
max = 11.0

[countries.US.bounds."USD/gal".grades.clear]
min = 2.0
max = 11.0

[countries.US.bounds."USD/L"]
min = 0.5
max = 2.5

# The dominant zone of each state, DC and the territories. Used only when
# ecom-api, us_extra_ids.csv and stations.csv all lack a timezone.
[countries.US.timezones]
AL = "America/Chicago"
AK = "America/Anchorage"
AZ = "America/Phoenix"
