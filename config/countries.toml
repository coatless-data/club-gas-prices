# failure or a delisting over a refurbishment does not read as a closure.
closed_after_days = 45

# lang, curr and pageSize=100 are unverified for this host: the research
# verified pageSize=50 with neither lang nor curr, and Japan returns HTTP 400
# for an unsupported lang. If the first dry run rejects them, cut this table
# back to fields = "FULL" and pageSize = "50".
[countries.AU.params]
fields = "FULL"
pageSize = "100"
lang = "en_AU"
curr = "AUD"

