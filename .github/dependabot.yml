version: 2

updates:
  # actions/* float on a major tag, so they only ever raise a major-bump PR.
  # The three third-party actions are pinned to a commit SHA with a version
  # comment, so every patch and minor raises one. Group that churn and leave
  # majors on their own, where they get read.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    commit-message:
      prefix: "chore(actions)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # Python. The uv ecosystem reads [project.dependencies], PEP 735
  # [dependency-groups] and [build-system.requires], and regenerates uv.lock,
  # which is what keeps `uv sync --locked` green in every workflow.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    versioning-strategy: "widen"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - "dependencies"
    cooldown:
      default-days: 7
    groups:
      python:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
