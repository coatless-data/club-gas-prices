name: Capture

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Capture and upload the artifact, but publish nothing
        type: boolean
        default: false
      countries:
        description: Country codes to capture, comma separated, or "all"
        type: string
        default: all
      force_fallback:
        description: Country codes forced onto their fallback source, comma separated
        type: string
        default: ""

run-name: ${{ inputs.dry_run && 'Capture (dry run)' || 'Capture' }}

concurrency:
  group: club-gas-data
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  capture:
    name: Capture
    runs-on: ubuntu-latest
    # The steps below can sum to 65 minutes on a month boundary.
    timeout-minutes: 75
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
      # `publish` builds the dashboard's files into the `current` release, and
      # the basemap block it writes into meta.json depends on this. Unset falls
      # back to OpenStreetMap tiles rather than failing.
      CARTO_BASEMAP_KEY: ${{ vars.CARTO_BASEMAP_KEY }}
      CLUB_GAS_WRITER: "1"
      COUNTRIES: ${{ inputs.countries || 'all' }}
      FORCE_FALLBACK: ${{ inputs.force_fallback || '' }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}
          fetch-depth: 0

      - name: Verify HEAD is the tip of the default branch
        env:
          BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --quiet origin "$BRANCH"
          head_sha="$(git rev-parse HEAD)"
          tip_sha="$(git rev-parse FETCH_HEAD)"
          if [ "$head_sha" != "$tip_sha" ]; then
            echo "::error::HEAD $head_sha is not the tip of origin/$BRANCH ($tip_sha)"
            exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Capture
        id: capture
        timeout-minutes: 15
        run: uv run club-gas capture --out out --countries "$COUNTRIES" --force-fallback "$FORCE_FALLBACK"

      - name: Upload the capture artifact
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v7
        with:
          name: capture-${{ steps.capture.outputs.capture_id || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
          path: out/
          retention-days: 30
          if-no-files-found: warn

      - name: Publish
        id: publish
        if: ${{ inputs.dry_run != true && steps.capture.outputs.all_failed != 'true' }}
        timeout-minutes: 10
        run: uv run club-gas publish out/capture

      - name: Close periods
        id: close
        if: ${{ steps.publish.outcome == 'success' }}
        continue-on-error: true
        # On the first capture of each month this does _recover_all, _close_month
        # and a full current rebuild. Rebuild budgets 60 minutes for the same
        # work. Ten was enough with no history and will not stay enough -- and
        # the failure self-perpetuates, because _close_month runs before the
        # release is marked non-prerelease, so a killed step leaves the month
        # open and the next capture retries the whole thing.
        timeout-minutes: 30
        run: uv run club-gas close-periods

      - name: Alerts
        if: ${{ !cancelled() && inputs.dry_run != true && steps.capture.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        run: |
          uv run club-gas alerts out/capture/status.json \
            --publish-outcome "${{ steps.publish.outcome }}" \
            --close-outcome "${{ steps.close.outcome }}"

      - name: Commit status/latest.json
        if: ${{ !cancelled() && inputs.dry_run != true && steps.capture.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 5
        env:
          BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
          CAPTURE_ID: ${{ steps.capture.outputs.capture_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            mkdir -p status
            cp out/capture/status.json status/latest.json
            git add status/latest.json
            if git diff --cached --quiet; then
              echo "status/latest.json is unchanged"
              exit 0
            fi
            git commit --quiet -m "capture ${CAPTURE_ID}"
            if git push --quiet origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "push attempt ${attempt} was rejected; resetting to origin/${BRANCH}"
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard FETCH_HEAD
          done
          echo "::warning::could not push status/latest.json after 3 attempts"

      - name: Gate
        if: ${{ inputs.dry_run != true && (steps.capture.outputs.all_failed == 'true' || steps.publish.outcome == 'failure') }}
        run: |
          echo "::error::no new data reached the current release"
          exit 1
