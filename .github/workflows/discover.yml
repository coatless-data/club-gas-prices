name: Discover

on:
  schedule:
    - cron: "41 3 2 * *"
  workflow_dispatch:

concurrency:
  group: club-gas-data
  cancel-in-progress: false

# contents: write lets the run commit config/watch.csv; discover writes no release.
permissions:
  contents: write
  issues: write

jobs:
  discover:
    name: Discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
      CONTACT_EMAIL: ${{ vars.CONTACT_EMAIL }}
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch || github.ref_name }}

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install the project
        run: uv sync --locked

      - name: Discover US station IDs
        timeout-minutes: 15
        run: uv run club-gas discover --watch

      # The sweep appends each new id to config/watch.csv on hold, so every
      # capture from the next one records its prices without publishing them.
      - name: Commit config/watch.csv
        timeout-minutes: 5
        env:
          BRANCH: ${{ github.event.repository.default_branch || github.ref_name }}
        run: |
          set -euo pipefail
          if [ ! -e config/watch.csv ]; then
            echo "there is no config/watch.csv to commit"
            exit 0
          fi
          git add config/watch.csv
          if git diff --cached --quiet; then
            echo "config/watch.csv is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet -m "discover: watch new US station ids"
          for attempt in 1 2 3; do
            if git push --quiet origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            # Rebased, not reset: a reset would drop the rows just appended.
            echo "push attempt ${attempt} was rejected; rebasing onto origin/${BRANCH}"
            git fetch --quiet origin "$BRANCH"
            git rebase --quiet FETCH_HEAD
          done
          echo "::error::could not push config/watch.csv; the discovery issue lists the ids"
          exit 1
